name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build unsigned release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/aziz-release.keystore

      - name: Get keystore alias
        run: |
          echo "Checking keystore..."

          ALIAS=$(keytool -list \
            -keystore android/aziz-release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -rfc 2>/dev/null | \
            awk -F'alias name: ' '/alias name: / {print $2; exit}' | \
            tr -d '\r')

          if [ -z "$ALIAS" ]; then
            echo "Could not automatically determine the keystore alias."
            echo "Available keystore entries:"
            keytool -list \
              -keystore android/aziz-release.keystore \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            exit 1
          fi

          echo "Keystore alias found."
          echo "KEYSTORE_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Sign the APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks android/aziz-release.keystore \
            --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --key-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          "$APKSIGNER" verify --verbose \
            android/app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aziz-attendance-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
